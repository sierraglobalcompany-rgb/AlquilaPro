name: F7 Lock Bootstrap

on:
  push:
    branches:
      - 'impl/f7-contracts-20261012'

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: impl/f7-contracts-20261012

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mbstring, dom, gd, fileinfo
          coverage: none

      - name: Generate and commit Dompdf lock
        run: |
          composer update dompdf/dompdf --with-dependencies --no-install --no-interaction --no-progress
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m 'build(contracts): lock dompdf dependency'
          git push origin HEAD:impl/f7-contracts-20261012
